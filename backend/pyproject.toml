[project]
name = "Orbitask"
version = "0.1.0"
description = "Production-grade autonomous AI assistant for email, calendar, and booking workflows."
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",

    "sqlalchemy>=2.0.40",
    "asyncpg>=0.30.0",
    "alembic>=1.16.0",
    "psycopg[binary]>=3.2.0",

    "redis>=6.0.0",

    "httpx>=0.28.0",

    "python-jose[cryptography]>=3.5.0",
    "cryptography>=45.0.0",

    "structlog>=25.0.0",

    "tenacity>=9.0.0",

    "email-validator>=2.2.0",

    "python-multipart>=0.0.20"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.12.0",
    "mypy>=1.16.0"
]

[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP"
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
