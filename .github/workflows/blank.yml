name: Orbitask CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_NAME: Orbitask
      ENVIRONMENT: test
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://assistant:assistant@localhost:5432/assistant
      REDIS_URL: redis://localhost:6379/0
      LOG_LEVEL: INFO
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: assistant
          POSTGRES_PASSWORD: assistant
          POSTGRES_DB: assistant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U assistant -d assistant"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"

      - name: Verify PostgreSQL connectivity
        run: |
          python - <<'PY'
          import asyncio
          import os
          import asyncpg

          async def check() -> None:
              connection = await asyncpg.connect(
                  os.environ["DATABASE_URL"].replace("postgresql+asyncpg://", "postgresql://")
              )
              try:
                  await connection.fetchval("SELECT 1")
              finally:
                  await connection.close()

          asyncio.run(check())
          PY

      - name: Verify Redis connectivity
        run: |
          python - <<'PY'
          import os
          from redis import Redis

          client = Redis.from_url(os.environ["REDIS_URL"])
          client.ping()
          PY

      - name: Lint
        run: ruff check app tests

      - name: Test with coverage
        run: pytest --cov=app --cov-report=term-missing

      - name: Build backend image
        working-directory: .
        run: docker build --file backend/Dockerfile backend
